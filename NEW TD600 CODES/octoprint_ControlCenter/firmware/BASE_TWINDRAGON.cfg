########################################
# MOTHERBOARD_TWINDRAGON.cfg
# Common Main MCU/Motherboard related Configuration for all printer variants
# Author: Vijay Raghav Varada, Hamil Sunny
# Version: 2
########################################

########################################
# X Steppers-M1
# See KINAMATICS.cfg and TOOLHEADX.cfg for more settings for this section
########################################

[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 32
homing_speed: 60
homing_retract_dist: 10.0


[tmc5160 stepper_x]
cs_pin: PC13
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
run_current: 1.20
hold_current: 0.60
sense_resistor: 0.075

########################################
# X- dual carriage Steppers-M2
# See KINAMATICS.cfg and TOOLHEADX.cfg for more settings for this section
########################################

[dual_carriage]
axis: x
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 32
homing_speed: 60
homing_retract_dist: 10.0

[tmc5160 dual_carriage]
cs_pin: PE3
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
run_current: 1.20
hold_current: 0.60
sense_resistor: 0.075

########################################
# Y Steppers- M4
# See KINAMATICS.cfg and TOOLHEADX.cfg for more settings for this section
########################################

[stepper_y]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 32
endstop_pin: ^PF2
homing_speed: 60
homing_retract_dist: 10.0

[tmc5160 stepper_y]
cs_pin: PB5
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
run_current: 1.20
hold_current: 0.60
sense_resistor: 0.075

########################################
# Y Steppers- M5
########################################

[stepper_y1]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 32
endstop_pin: ^PF2

[tmc5160 stepper_y1]
cs_pin: PG14
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
run_current: 1.20
hold_current: 0.60
sense_resistor: 0.075

########################################
# Z Steppers- M3
# See KINAMATICS.cfg for more settings for this section
########################################
[stepper_z]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
microsteps: 8
rotation_distance: 4
endstop_pin: ^PF1
homing_speed: 50
homing_retract_dist: 5.0

[tmc5160 stepper_z]
cs_pin: PB9
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
interpolate: False
hold_current: 1.5
run_current: 2.5
sense_resistor: 0.022

########################################
# Redundant Extruder Extruder Side 0
########################################

[extruder_stepper extruder_side0]
extruder: extruder
step_pin:  PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 7.710  #22.102

[tmc5160 extruder_stepper extruder_side0]
cs_pin: PG10
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
hold_current: 0.40
run_current: 1.00
interpolate: False
sense_resistor: 0.075

########################################
# Redundant Extruder Extruder Side 1
########################################

[extruder_stepper extruder_side1]
extruder: extruder1
step_pin: PD4
dir_pin: PD3
enable_pin: !PD6 
microsteps: 16
rotation_distance: 7.710  #22.102

[tmc5160 extruder_stepper extruder_side1]
cs_pin: PD5
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
hold_current: 0.40
run_current: 1.00
interpolate: False
sense_resistor: 0.075

########################################
# Heater Bed
########################################
[heater_bed]
heater_pin: PA3
sensor_type: EPCOS 100K B57560G104F #Generic 3950
sensor_pin: PB1
control: pid
pid_kp: 45.874
pid_ki: 1.335
pid_kd: 393.945
pwm_cycle_time: 0.3
min_temp: -150
max_temp: 150

########################################
# Probe and ABL
########################################

[probe]
pin: PD8
x_offset: 0
y_offset: 0
#z_offset: -0.2
sample_retract_dist: 2.0
speed: 4
lift_speed: 10
samples_tolerance: 0.05
samples:1
samples_result: average
samples_tolerance_retries : 8

########################################
# Bed Mesh & Exclude Objects
########################################

[bed_mesh]
horizontal_move_z: 5
probe_count: 5,5
algorithm: bicubic
#adaptive_margin: 5

########################################
# Input Shaping 
########################################

[input_shaper]

########################################
# IDEX.cfg
# Common IDEX related Configuration for all printer variants
# Author: Vijay Raghav Varada
# Version: 1
#Klipper v0.12.0 IDEX Config. WILL NOT WORK WITH PREVIOUS VERION OF KLIPPER!
########################################

[respond]
default_type: echo

########################################
# Misc.
########################################


[delayed_gcode STARTUP]
initial_duration: 1
gcode:
    SET_LED LED=toolhead0 GREEN=1.0
    SET_LED LED=toolhead1 GREEN=0.0

[gcode_macro IDEX_STATUS]
gcode:
    RESPOND MSG="{printer.dual_carriage.carriage_0}"
    RESPOND MSG="{printer.dual_carriage.carriage_1}"

[gcode_macro PARK_TOOL]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% if printer.dual_carriage is defined %}
        {% if 'x' not in printer.toolhead.homed_axes %}
            RESPOND TYPE=echo MSG="PARK_TOOL skipped (X not homed)"
        {% else %}
            SET_GCODE_OFFSET X=0 Y=0 Z=0
            G90
            {% if printer.toolhead.extruder == 'extruder' %}
                {% set XPOS = printer.configfile.config.stepper_x.position_min|float %}
                G1 X{XPOS} F{printer_var.feedrate}
            {% elif (printer.toolhead.extruder) == 'extruder1' %}
                {% set XPOS = printer.configfile.config.dual_carriage.position_max|float %}
                G1 X{XPOS} F{printer_var.feedrate}
            {% else %}
                RESPOND TYPE=error MSG="Unknown extruder: {printer.toolhead.extruder}"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro PURGE_POSITION]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% if printer.dual_carriage is not defined %}
        RESPOND TYPE=echo MSG="PURGE_POSITION skipped (no dual_carriage)"
    {% elif printer.toolhead.homed_axes != "xyz" %}
        RESPOND TYPE=echo MSG="PURGE_POSITION skipped (axes not homed)"
    {% else %}
        G90
        {% if printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "INACTIVE" %}
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F9000
            RESPOND TYPE=echo MSG="T0 PURGE POSITION"
        {% elif printer.dual_carriage.carriage_0 == "INACTIVE" and printer.dual_carriage.carriage_1 == "PRIMARY" %}
            G1 X{printer_var.tool1_pause_position_x} Y{printer_var.tool1_pause_position_y} F9000
            RESPOND TYPE=echo MSG="T1 PURGE POSITION"
        {% elif printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "COPY" %}
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F9000
            RESPOND TYPE=echo MSG="COPY MODE PURGE POSITION"
        {% elif printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "MIRROR" %}
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F9000
            RESPOND TYPE=echo MSG="MIRROR MODE PURGE POSITION"
        {% else %}
            RESPOND TYPE=echo MSG="PURGE_POSITION: No matching carriage state"
        {% endif %}
    {% endif %}

########################################
# T0/T1 (Single/Dual Mode)
########################################

[gcode_macro _IDEX_SAFE_Z_HOP]
description: Internal helper to perform a ceiling-safe Z hop up or down
variable_last: 0
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set dir = params.DIR|default('UP')|upper %}
    {% set hop = params.HOP|default(printer_var.z_hop)|float %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        RESPOND TYPE=echo MSG="_IDEX_SAFE_Z_HOP skipped (axes not homed)"
    {% else %}
        {% if dir == 'UP' %}
            {% if hop > 0 %}
                {% set max_z = printer.toolhead.axis_maximum.z|float %}
                {% set cur_z = printer.toolhead.position.z|float %}
                {% set lift = hop if cur_z < (max_z - hop) else (max_z - cur_z) %}
                {% if lift > 0 %}
                    G91
                    G1 Z{lift} F900
                    G90
                    SET_GCODE_VARIABLE MACRO=_IDEX_SAFE_Z_HOP VARIABLE=last VALUE={lift}
                {% else %}
                    SET_GCODE_VARIABLE MACRO=_IDEX_SAFE_Z_HOP VARIABLE=last VALUE=0
                {% endif %}
            {% endif %}
        {% elif dir == 'DOWN' %}
            {% set lift = printer["gcode_macro _IDEX_SAFE_Z_HOP"].last|default(0)|float %}
            {% if lift > 0 %}
                G91
                G1 Z-{lift} F900
                G90
                SET_GCODE_VARIABLE MACRO=_IDEX_SAFE_Z_HOP VARIABLE=last VALUE=0
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro _IDEX_SWITCH_TOOL]
description: Internal helper to switch active IDEX tool with optional autopark/z-hop
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set target = params.TOOL|int %}                      
    {% if printer.dual_carriage is not defined %}
        RESPOND TYPE=echo MSG="IDEX not enabled"
    {% else %}
        {% set c0 = printer.dual_carriage.carriage_0 %}
        {% set c1 = printer.dual_carriage.carriage_1 %}
        {% set current_tool = 0 if (c0 == 'PRIMARY' and printer.toolhead.extruder == 'extruder') else (1 if (c1 == 'PRIMARY' and printer.toolhead.extruder == 'extruder1') else -1) %}
        {% if current_tool == target %}
            RESPOND TYPE=echo MSG="Tool T{target} already active"
        {% else %}
            M400
            {% set do_autopark = (printer_var.autopark|int == 1 and printer.toolhead.homed_axes == 'xyz') %}
            
            # Check position bounds for autopark to prevent movement outside bed limits
            {% set can_autopark = true %}
            {% if do_autopark %}
                {% if target == 0 and printer.gcode_move.gcode_position.x > printer_var.bed_x_max|float %}
                    {% set can_autopark = false %}
                {% elif target == 1 and printer.gcode_move.gcode_position.x < printer_var.bed_x_min|float %}
                    {% set can_autopark = false %}
                {% endif %}
            {% endif %}
            
            {% if do_autopark and can_autopark %}
                _IDEX_SAFE_Z_HOP DIR=UP
                SAVE_GCODE_STATE NAME=toolhead_state
                PARK_TOOL
            {% endif %}

            {% if target == 0 %}
                ACTIVATE_EXTRUDER EXTRUDER=extruder
                SET_DUAL_CARRIAGE CARRIAGE=0
                SET_LED LED=toolhead0 GREEN=1.0
                SET_LED LED=toolhead1 GREEN=0.0
                RESPOND TYPE=echo MSG="Active Extruder: 0"
            {% else %}
                ACTIVATE_EXTRUDER EXTRUDER=extruder1
                SET_DUAL_CARRIAGE CARRIAGE=1
                SET_LED LED=toolhead0 GREEN=0.0
                SET_LED LED=toolhead1 GREEN=1.0
                RESPOND TYPE=echo MSG="Active Extruder: 1"
            {% endif %}

            {% if do_autopark and can_autopark %}
                RESTORE_GCODE_STATE NAME=toolhead_state MOVE=1 MOVE_SPEED={printer_var.movespeed}
                _IDEX_SAFE_Z_HOP DIR=DOWN
            {% endif %}
            
            # Apply tool offsets AFTER restoring state to prevent overwriting
            {% if target == 0 %}
                {% if printer.gcode_move.gcode_position.x > printer_var.bed_x_max|float %}
                    SET_GCODE_OFFSET X=0 Y=0 Z={printer.save_variables.variables.babystep_z|default(0.0)} 
                {% else %}
                    SET_GCODE_OFFSET X=0 Y=0 Z={printer.save_variables.variables.babystep_z|default(0.0)} MOVE=1 MOVE_SPEED={printer_var.movespeed}
                {% endif %}
            {% else %}
                {% if printer.gcode_move.gcode_position.x < printer_var.bed_x_min|float %}
                    SET_GCODE_OFFSET X={printer.save_variables.variables.tool_offset_x|default(0)} Y={printer.save_variables.variables.tool_offset_y|default(0)} Z={printer.save_variables.variables.tool_offset_z|default(0) + printer.save_variables.variables.babystep_z|default(0.0)} 
                {% else %}
                    SET_GCODE_OFFSET X={printer.save_variables.variables.tool_offset_x|default(0)} Y={printer.save_variables.variables.tool_offset_y|default(0)} Z={printer.save_variables.variables.tool_offset_z|default(0) + printer.save_variables.variables.babystep_z|default(0.0)} MOVE=1 MOVE_SPEED={printer_var.movespeed}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro T0]
description: Activate T0 in "FULL_CONTROL" or "AUTO-PARK"
gcode:
    {% if printer.dual_carriage is defined and printer.dual_carriage.carriage_1 == 'PRIMARY' %}
        _IDEX_SWITCH_TOOL TOOL=0
    {% elif printer.dual_carriage is defined and printer.dual_carriage.carriage_0 == 'PRIMARY' %}
        RESPOND TYPE=echo MSG="T0 already active"
    {% endif %}


[gcode_macro T1]
description: Activate T1 in "FULL_CONTROL" or "AUTO-PARK"
gcode:
    {% if printer.dual_carriage is defined and printer.dual_carriage.carriage_0 == 'PRIMARY' %}
        _IDEX_SWITCH_TOOL TOOL=1
    {% elif printer.dual_carriage is defined and printer.dual_carriage.carriage_1 == 'PRIMARY' %}
        RESPOND TYPE=echo MSG="T1 already active"
    {% endif %}





########################################
# Temperature & Fans
########################################

## DUAL-CARRIAGES : FAN MANAGEMENT

[gcode_macro M106]
description: Override "M106" to allow multiple extruders.
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set raw_speed = params.S|default(0)|float %}
    {% set fan_speed = (raw_speed / 255.0)|round(2) %}
    {% if (params.P) is defined %}
        {% set P_fan = printer_var.fan0 if (params.P)|int == 0 else printer_var.fan1 %}
        SET_FAN_SPEED FAN={P_fan} SPEED={fan_speed}
    {% elif printer.dual_carriage is defined %}
        SET_FAN_SPEED FAN={printer_var.fan0} SPEED={fan_speed}
        SET_FAN_SPEED FAN={printer_var.fan1} SPEED={fan_speed}
    {% endif %}
    
[gcode_macro M107]
description: Override "M107" to allow multiple extruders.
gcode:
    M106 S0
    

## DUAL-CARRIAGES : HEATERS MANAGEMENT
    
[gcode_macro M104]
rename_existing: M104.1
description: Override "M104" to allow multiple extruders to be synchronized.
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(-1)|int %}
    {% if tool == -1 %}
        {% if printer.dual_carriage.carriage_1 == "COPY" or printer.dual_carriage.carriage_1 == "MIRROR" %}
            M104.1 T0 S{temp}
            M104.1 T1 S{temp} # + printer_var.offset_temp|float}
        {% else %}
            M104.1 S{temp}
        {% endif %}
    {% else %}
        M104.1 T{tool} S{temp}
    {% endif %}
    
[gcode_macro M109]
rename_existing: M109.1
description: Override "M109" to allow multiple extruders to be synchronized.
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set temp = params.S|default(0)|float %}
    {% set tool = params.T|default(-1)|int %}
    {% if tool == -1 %}
        {% if printer.dual_carriage.carriage_1 == "COPY" or printer.dual_carriage.carriage_1 == "MIRROR" %}
            #SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={params.S|float}
            #TEMPERATURE_WAIT SENSOR=extruder MINIMUM={params.S|float - printer_var.offset_temp|float} MAXIMUM={params.S|float + printer_var.offset_temp|float}
            #TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={params.S|float - printer_var.offset_temp|float} MAXIMUM={params.S|float + printer_var.offset_temp|float}
            RESPOND TYPE=echo MSG="Heating in idex modes"
            M104.1 T0 S{temp}
            M104.1 T1 S{temp} # + printer_var.offset_temp|float}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - printer_var.offset_temp} #M109.1 T0 S{temp}
            TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={temp - printer_var.offset_temp} #M109.1 T1 S{temp} # + printer_var.offset_temp|float}
        {% else %}
            #M109.1 S{temp}
            SET_HEATER_TEMPERATURE HEATER={printer.toolhead.extruder} TARGET={temp}
            TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={temp - printer_var.offset_temp} #MAXIMUM={params.S|float + printer_var.offset_temp|float}
        {% endif %}
    {% else %}
        #M109.1 T{tool} S{temp} # + printer_var.offset_temp|float}
        #SET_HEATER_TEMPERATURE HEATER={printer.toolhead.extruder} TARGET={params.S|float}
        #TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={params.S|float - printer_var.offset_temp|float}
        
        
        {% if params.T == '0' %}
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - printer_var.offset_temp} #MAXIMUM={params.S|float + printer_var.offset_temp|float}
        {% elif params.T == '1' %}
            SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp}
            TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={temp - printer_var.offset_temp} #MAXIMUM={params.S|float + printer_var.offset_temp|float}
        {% endif %}
    {% endif %}

########################################
# IDEX Modes: Duplicate/Mirror
########################################

[gcode_macro M605]
description: Set the dual-carriages mode
gcode:
    {% set mode = params.S|default(1)|int %}
    {% set offset_temp = params.R|default(0)|float %}
    {% if printer.dual_carriage is defined %}
        {% if mode == 0 or mode == 1 %}
            # S0: FULL_CONTROL autopark off, S1: FULL_CONTROL autopark on #
            SET_GCODE_VARIABLE MACRO=PRINTER_VARIABLES VARIABLE=autopark VALUE={1 if mode == 1 else 0}
            FULL_CONTROL
        {% elif mode == 2 %}
            {% if printer.save_variables.variables.tool_offset_z > 1 or printer.save_variables.variables.tool_offset_z < -1 %}
                CANCEL_PRINT
                RESPOND TYPE=error MSG="Z Tool Offset too high, cannot go into Duplication Mode, do IDEX calibration first"
            {% else %}
                _IDEX_ENTER_PAIRED_MODE MODE=COPY R={offset_temp}
            {% endif %}
        {% elif mode == 3 %}
            {% if printer.save_variables.variables.tool_offset_z > 1 or printer.save_variables.variables.tool_offset_z < -1 %}
                CANCEL_PRINT
                RESPOND TYPE=error MSG="Z Tool Offset too high, cannot go into Mirror Mode, do IDEX calibration first"
            {% else %}
                _IDEX_ENTER_PAIRED_MODE MODE=MIRROR R={offset_temp}
            {% endif %}
        {% else %}
            RESPOND TYPE=error MSG="Unsupported M605 S{mode} (valid: 0,1,2,3)"
        {% endif %}
        G1 F3000
    {% endif %}



[gcode_macro FULL_CONTROL]
description: Set the dual-carriages mode to "FULL_CONTROL"
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% if printer.dual_carriage is defined %}
        # unsync both carriages
        {% if 'x' not in printer.toolhead.homed_axes %}
            G28 X0
        {% endif %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0
        SET_DUAL_CARRIAGE CARRIAGE=1
        SET_LED LED=toolhead0 GREEN=0.0
        SET_LED LED=toolhead1 GREEN=1.0
        G1 X{printer.configfile.config.dual_carriage.position_max|float} F{printer_var.feedrate}
        SET_DUAL_CARRIAGE CARRIAGE=0
        SET_LED LED=toolhead0 GREEN=1.0
        SET_LED LED=toolhead1 GREEN=0.0
        G1 X{printer.configfile.config.stepper_x.position_min|float} F{printer_var.feedrate}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1 #SYNC_EXTRUDER_STEPPERS EXTRUDER=extruder1
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side1 MOTION_QUEUE=extruder1
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_GCODE_OFFSET X=0 Y=0 Z=0


        #M420 S1 #Enable bed mesh where needed. 
    {% endif %}

[gcode_macro _SYNC_EXTRUDERS_TEMP]
gcode:
    {% set tool = params.T|default(-1)|int %}
    {% set temp = printer["extruder"].target|float %}
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    #M109 S{temp}
    SET_HEATER_TEMPERATURE HEATER={printer.toolhead.extruder} TARGET={temp} #- printer_var.offset_temp}
    TEMPERATURE_WAIT SENSOR={printer.toolhead.extruder} MINIMUM={temp - printer_var.offset_temp} #MAXIMUM={temp + printer_var.offset_temp|float}
    

#[gcode_macro _IDEX_ENTER_PAIRED_MODE]
[gcode_macro _IDEX_ENTER_PAIRED_MODE]
description: Internal helper to enter COPY or MIRROR paired IDEX modes
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set mode = params.MODE|upper %}              
    {% set offset_temp = params.R|default(0)|float %}
    {% if printer.dual_carriage is not defined %}
        RESPOND TYPE=error MSG="IDEX not enabled"
    {% else %}
        FULL_CONTROL
        {% if printer.toolhead.homed_axes != 'xyz' %}
            CANCEL_PRINT
            RESPOND TYPE=error MSG="Must home printer before going into Duplication or Mirror Mode"
        {% else %}
            _IDEX_SAFE_Z_HOP DIR=UP
            {% if mode == 'COPY' %}
                {% set bed_x_mid = 0.5 * (printer_var.bed_x_max|float - printer_var.bed_x_min|float) %}
                {% set target_x = bed_x_mid %}
            {% elif mode == 'MIRROR' %}
                {% set target_x = printer_var.bed_x_max|float %}
            {% else %}
                RESPOND TYPE=error MSG="Unknown paired mode: {mode}"
                {% set target_x = printer_var.bed_x_max|float %}
            {% endif %}
            SET_DUAL_CARRIAGE CARRIAGE=1
            G1 X{target_x} F{printer_var.feedrate}
            SET_DUAL_CARRIAGE CARRIAGE=0
            G1 X{printer_var.bed_x_min|float} F{printer_var.feedrate}
            SET_GCODE_VARIABLE MACRO=PRINTER_VARIABLES VARIABLE=offset_temp VALUE={offset_temp}
            _SYNC_EXTRUDERS_TEMP
            SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
            SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side0 MOTION_QUEUE=extruder 
            SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side1 MOTION_QUEUE=extruder
            {% if mode == 'COPY' %}
                SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
            {% else %}
                SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
            {% endif %}
            _IDEX_SAFE_Z_HOP DIR=DOWN
            SET_LED LED=toolhead0 GREEN=1.0
            SET_LED LED=toolhead1 GREEN=1.0
        {% endif %}
    {% endif %}
    
########################################
# IDEX Bed Mesh Calibration
########################################
    
[gcode_macro G29]
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set bed_x_mid = 0.5 * (printer_var.bed_x_max|float - printer_var.bed_x_min|float) %}
    BED_MESH_CLEAR
    CLEAR_PAUSE
    {% if printer.dual_carriage.carriage_1 == "COPY" %}
        BED_MESH_CALIBRATE MESH_MIN=20,20 MESH_MAX={bed_x_mid|float - 20},{printer_var.bed_y_max|float -20} PROBE=3,5
    {% elif  printer.dual_carriage.carriage_1 == "MIRROR" %}
        BED_MESH_CALIBRATE MESH_MIN=20,20 MESH_MAX={bed_x_mid|float - 40},{printer_var.bed_y_max|float -40} PROBE=3,5
    {% elif  printer.dual_carriage.carriage_1 == "PRIMARY"  %} # If only T1 is prefered to level with
    # There is a bug in klipper preventing leveling with T1
        T0
        {% if printer.extruder.temperature|float <= 150 %}
            M109 T0 S150
        {% endif %}
        BED_MESH_CALIBRATE
        M104 T0 S0
        T1
    {% else %}
        {% if printer.extruder.temperature|float <= 150 %}
            M109 T0 S150
        {% endif %}
        BED_MESH_CALIBRATE
    {% endif %}
    BED_MESH_PROFILE SAVE=p1
    SAVE_CONFIG NO_RESTART=1
    M420 S1
    
########################################
# IDEX Homing Sequence
########################################

[homing_override]
gcode:
    {% if printer.dual_carriage is defined %}
        # unsync both carriages
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0
        SET_LED LED=toolhead0 GREEN=1.0
        SET_LED LED=toolhead1 GREEN=0.0
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1 #SYNC_EXTRUDER_STEPPERS EXTRUDER=extruder1
        SYNC_EXTRUDER_MOTION EXTRUDER=extruder_side1 MOTION_QUEUE=extruder1
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_GCODE_OFFSET X=0 Y=0 Z=0
    {% endif %}
    BED_MESH_CLEAR
    SAVE_VARIABLE VARIABLE=babystep_z VALUE=0.0
    SAVE_CONFIG NO_RESTART=1
    {% if params.X and not params.Y and not params.Z %}
        G28 X0
    {% endif %}
    {% if not params.X and params.Y and not params.Z %}
        G28 Y0
    {% endif %}
    {% if not params.X and not params.Y and params.Z %}
        G28 Z0
        G91
        G0 Z-4
        G90
    {% endif %}    
    {% if params.Y and params.X and not params.Z %}
        G28 Y0
        G28 X
    {% endif %}
    {% if not params.X and not params.Y and not params.Z %}
        # G1 Z10 F6 # No need to do this, G28 Z already does it. Move Z up just incase the nozzle is too close to the bed before homing (can be the case in cancelled prints/powercuts/emergency stops)
        G28 Z0 # Home z, because detector is on the bed, not the nozzle
        G28 Y0 # Do Y next, to avoid potentially hitting the back of the nozzle wipe.
        G28 X0
        G91
        G0 Z-4
        G90
    {% endif %}
    {% if params.X and params.Y and params.Z %}
        G28 Z0
        G28 Y0
        G28 X0
        G91
        G0 Z-4
        G90
    {% endif %}



########################################
# PAUSE & Resume Functionality for IDEX
########################################
[pause_resume]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE

gcode:
  # Parameters
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set z = params.Z|default(2.5)|float %}                                                                       ;Zhop on Pause
    {% set r = params.R|default(2.0)|float %}                                                                       ;Retract on Pause
    {% if printer['pause_resume'].is_paused|int == 0 %}                                                             ;if PAUSE was already called, skip
        # idex_status mapping: 0=T0 single, 1=T1 single, 2=Copy Mode, 3=Mirror Mode
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target|default(0)|int}        ; set hotend temp variable for reference in resume macro
        {% if printer['extruder1'] is defined %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp1 VALUE={printer['extruder1'].target|default(0)|int}  ; set hotend1 temp if present
        {% else %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp1 VALUE=0
        {% endif %}
        ;Filament Sensors are set/reset in ControlCenter
        ;SET_FILAMENT_RUNOUT_SENSOR S=0                                                                            ;Disable Filament Runout Sensors on pause
        ;SET_FILAMENT_JAM_SENSOR S=0                                                                                 ;Disable Filament Jam Sensors on pause

        {% if printer.dual_carriage.carriage_1 == "COPY" or printer.dual_carriage.carriage_1 == "MIRROR" %}
            SAVE_DUAL_CARRIAGE_STATE NAME=IDEX_PAUSE_STATE                                                         ; save current print position for resume
        {% else %}
            SAVE_GCODE_STATE NAME=PAUSE
        {% endif %}
                                                                         
        BASE_PAUSE                                                                                                  ; Pause print

        {% if printer.toolhead.homed_axes == "xyz" %}
            G91                                                                                                         ; relative positioning
            G1 E-{r} F600                                                                                               ; retract filament
            G90

            {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}                              ; check that zhop doesn't exceed z max
                G91                                                                                                     ; relative positioning
                G1 Z{z} F900                                                                                            ; raise Z up by z hop amount
                G90
            {% else %}
                RESPOND TYPE=echo MSG="Pause zhop exceeds maximum Z height."                                         ; if z max is exceeded, show message
            {% endif %}
        {% else %}
            RESPOND TYPE=echo MSG="Pause movement skipped (axes not homed)"
            G91
            G1 E-{r} F600                                                                                               ; retract filament if possible
            G90
        {% endif %}

        # Determine and store current IDEX state, then delegate move/message to PURGE_POSITION #
        {% if printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "INACTIVE" %}
            SAVE_VARIABLE VARIABLE=idex_status VALUE=0
        {% elif printer.dual_carriage.carriage_0 == "INACTIVE" and printer.dual_carriage.carriage_1 == "PRIMARY" %}
            SAVE_VARIABLE VARIABLE=idex_status VALUE=1
        {% elif printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "COPY" %}
            SAVE_VARIABLE VARIABLE=idex_status VALUE=2
        {% elif printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "MIRROR" %}
            SAVE_VARIABLE VARIABLE=idex_status VALUE=3
        {% endif %}
        PURGE_POSITION
        {% set _status = printer.save_variables.variables.idex_status|default(0)|int %}
        {% if _status in [2,3] %}
            M605 S1  ; revert COPY/MIRROR to FULL_CONTROL after parking
        {% endif %}
    {% endif %}


[gcode_macro CLEAN_NOZZLE]
gcode:
  {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
  {% if printer.toolhead.homed_axes == "xyz" %}
      {% if printer.dual_carriage.carriage_0 == "PRIMARY" and printer.dual_carriage.carriage_1 == "INACTIVE" %}
            G90
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F7000
            G1 X{printer_var.tool0_pause_position_x + 40} F7000
            G1 X{printer_var.tool0_pause_position_x}
            G1 X{printer_var.tool0_pause_position_x + 40}
            G1 X{printer_var.tool0_pause_position_x}
      {% elif printer.dual_carriage.carriage_0 == "INACTIVE" and printer.dual_carriage.carriage_1 == "PRIMARY" %}
            G90
            G1 X{printer_var.tool1_pause_position_x} Y{printer_var.tool1_pause_position_y} F7000
            G1 X{printer_var.tool1_pause_position_x - 40} F7000
            G1 X{printer_var.tool1_pause_position_x}
            G1 X{printer_var.tool1_pause_position_x - 40}
            G1 X{printer_var.tool1_pause_position_x}
      {% else %}
            G90
            G1 X{printer_var.tool0_pause_position_x} Y{printer_var.tool0_pause_position_y} F7000
            G1 X{printer_var.tool0_pause_position_x + 40} F7000
            G1 X{printer_var.tool0_pause_position_x}
            G1 X{printer_var.tool0_pause_position_x + 40}
            G1 X{printer_var.tool0_pause_position_x}
      {% endif %}
  {% else %}
      RESPOND TYPE=echo MSG="CLEAN_NOZZLE skipped (axes not homed)"
  {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_etemp: 0
variable_etemp1: 0
variable_activetool: 0
gcode:
    {% set printer_var = printer["gcode_macro PRINTER_VARIABLES"] %}
    {% set e = params.E|default(20)|float %}                      ; hotend prime amount (mm)
    {% set r = params.R|default(1)|float %}                       ; retract recovery (mm)
    {% if printer['pause_resume'].is_paused|int != 1 %}
        RESPOND TYPE=echo MSG="RESUME ignored (not paused)"
    {% else %}
        ; Restore temps (non-blocking first)
        {% if etemp > 0 %} M104 T0 S{etemp|int} {% endif %}
        {% if etemp1 > 0 %} M104 T1 S{etemp1|int} {% endif %}
        {% if etemp > 0 %}
            RESPOND TYPE=echo MSG="Heating extruder 0 .."
            M109 T0 S{etemp|int}
        {% endif %}
        {% if etemp1 > 0 %}
            RESPOND TYPE=echo MSG="Heating extruder 1 .."
            M109 T1 S{etemp1|int}
        {% endif %}
        {% set status = printer.save_variables.variables.idex_status|default(0)|int %}
        # status: 0=T0,1=T1,2=Copy,3=Mirror
        {% if status == 0 %}
            M605 S1
            T0
            PURGE_POSITION
            {% set restore_cmd = 'RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150' %}
        {% elif status == 1 %}
            M605 S1
            T1
            PURGE_POSITION
            {% set restore_cmd = 'RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150' %}
        {% elif status == 2 or status == 3 %}
            M605 S3  ; use mirror for synchronized cleaning (matches previous behavior)
            PURGE_POSITION
            {% set restore_cmd = 'RESTORE_DUAL_CARRIAGE_STATE NAME=IDEX_PAUSE_STATE MOVE=1 MOVE_SPEED=150' %}
        {% else %}
            M605 S1
            T0
            PURGE_POSITION
            {% set restore_cmd = 'RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=150' %}
        {% endif %}
        # Determine if we can safely prime: use min_extrude_temp of the currently active tool (extruder or extruder1) #
        {% set active_tool = printer.toolhead.extruder %}
        {% if active_tool == 'extruder1' and printer.configfile.settings.extruder1 is defined %}
            {% set min_temp = printer.configfile.settings.extruder1.min_extrude_temp|float %}
        {% else %}
            {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|float %}
        {% endif %}
        {% set can_prime = (printer[active_tool].temperature|float >= min_temp) %}
        {% if can_prime %}
            G91
            G1 E{e} F400
            G1 E-{r} F600
            G90
        {% endif %}
        CLEAN_NOZZLE
        M420 S1
        {% if printer.toolhead.homed_axes == "xyz" %}
            { restore_cmd }
        {% else %}
            RESPOND TYPE=echo MSG="RESUME position restore skipped (axes not homed)"
        {% endif %}
        {% if can_prime %}
            G91
            G1 E{r} F600
            G90
        {% endif %}
        BASE_RESUME VELOCITY=150
    {% endif %}
