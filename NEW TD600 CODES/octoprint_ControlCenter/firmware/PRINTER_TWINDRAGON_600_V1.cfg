########################################
# PRINTERS_TWINDRAGON_600x600.cfg
# Printer specific configurations Configuration
# Author: Vijay Raghav Varada, Yashas B Padmashali
# Version: 2
########################################


########################################
# Core Configs, Common to all printers
[include CORE_GCODE_MACROS.cfg]
########################################

########################################
# Select Any One Printer Family Series
[include BASE_TWINDRAGON.cfg]
#[include BASE_DRAGON.cfg]
########################################

########################################
# include Add-Ons
#----------------------------------------
# Filament Sensors on Main Board
#----------------------------------------
[include T0_FILAMENT_RUNOUT_SENSOR.cfg]
[include T0_FILAMENT_JAM_SENSOR.cfg]
#----------------------------------------
[include T1_FILAMENT_RUNOUT_SENSOR.cfg]
[include T1_FILAMENT_JAM_SENSOR.cfg]
#----------------------------------------
# Other Add Ons:
#----------------------------------------
[include MAG_DOOR.cfg]
[include ELECTRONICS_CHAMBER_COOLING.cfg]
########################################


########################################
# Select Any  One Toolhead0 Configuration
[include TOOLHEADS_TD-01_TOOLHEAD0.cfg]
#[include TOOLHEADS_TD-02_TOOLHEAD0.cfg]
########################################


########################################
# Select Any One Toolhead1 Configuration
# Disabled for single toolhead
[include TOOLHEADS_TD-01_TOOLHEAD1.cfg]
#[include TOOLHEADS_TD-02_TOOLHEAD1.cfg]
########################################

[printer]
kinematics: hybrid_corexy
max_velocity: 400 #1000 #700
max_accel: 7000 #30000
max_accel_to_decel: 6000 # 5000
max_z_velocity: 20
max_z_accel: 50 #50

########################################
# IDEX Config
########################################

[gcode_macro PRINTER_VARIABLES]
# Offset coordinates for dual_carriage
variable_offset_x: 0 #-0.06  #-0.3 #was -0.15
variable_offset_y: 0 #-0.15 #was -0.15 #-0.3 #was0
variable_offset_z: 0  # 0.23
# Autopark parameters
## default autopark: 0:inactive - 1:active
variable_autopark: 1
variable_z_hop: 0.6
variable_movespeed: 300 #mm/s
variable_feedrate: 8000 #mm/min
# HeatBed size
variable_bed_x_min: 0
variable_bed_x_max: 600 #620rev2
variable_bed_y_min: 0
variable_bed_y_max: 600 #620rev2
variable_bed_z_min: 0
variable_bed_z_max: 414
# Print cooling fans names
variable_fan0: 'extruder_CF'
variable_fan1: 'extruder1_CF'
# Extruders temp
variable_offset_temp: 4
# Pause Positions
variable_tool0_pause_position_x: -27
variable_tool0_pause_position_y: -112
variable_tool1_pause_position_x: 648
variable_tool1_pause_position_y: -112
# Printer Configuration
variable_is_dual_nozzle: 1
variable_ptfe_tube_length: 1500
# Bed Calibration Positions
variable_bed_calibration_x1: 112
variable_bed_calibration_y1: 37
variable_bed_calibration_x2: 527
variable_bed_calibration_y2: 37
variable_bed_calibration_x3: 322
variable_bed_calibration_y3: 583
variable_bed_calibration_x4: 322
variable_bed_calibration_y4: 366
gcode:
    G90

########################################
# X Axis
########################################

[stepper_x]
position_endstop: -77.000 #-22
position_min: -77.000 #-22
position_max: 610.000 

########################################
# IDEX Axis
########################################

[dual_carriage]
position_endstop: 688 #743 
position_min: -2 #45 
position_max: 688 #743

########################################
# Y Axis
########################################

[stepper_y]
position_endstop: 637 #625 #350
position_max: 637 #625 #350
position_min: -120 #-150 #-110

########################################
# Z Axis
########################################

[stepper_z]
position_endstop: 414 #410 #417.000
position_max: 414 #410 #417.000
position_min: -6

########################################
# Bed Mesh
########################################

[bed_mesh]
mesh_min: 70, 70 #was 50,50
mesh_max: 550, 500 #was 570,550
probe_count: 4,4 #was 5,5
speed: 200

########################################
# Input Shaping and Resonance
########################################

[resonance_tester]
probe_points:
    310,120,20
accel_chip: adxl345 toolhead0

########################################CM4

[extruder_stepper extruder_side0]
dir_pin: !PD7