########################################
# PRINTERS_TWINDRAGON_600x300.cfg
# Printer specific configurations Configuration
# Author: Vijay Raghav Varada, Hamil Sunny
# Version: 2
########################################

########################################
# Core Configs, Common to all printers
[include CORE_GCODE_MACROS.cfg]
########################################

########################################
# Select Any One Printer Family Series
[include BASE_TWINDRAGON.cfg]
#[include BASE_DRAGON.cfg]
########################################

########################################
# include Add-Ons
#----------------------------------------
# Filament Sensors on Main Board
#----------------------------------------
[include T0_FILAMENT_RUNOUT_SENSOR.cfg]
[include T0_FILAMENT_JAM_SENSOR.cfg]
#----------------------------------------
[include T1_FILAMENT_RUNOUT_SENSOR.cfg]
[include T1_FILAMENT_JAM_SENSOR.cfg]
#----------------------------------------
# Other Add Ons:
#----------------------------------------
[include MAG_DOOR.cfg]
[include ELECTRONICS_CHAMBER_COOLING.cfg]
########################################


########################################
# Select Any  One Toolhead0 Configuration
[include TOOLHEADS_TD-01_TOOLHEAD0.cfg]
#[include TOOLHEADS_TD-02_TOOLHEAD0.cfg]
########################################


########################################
# Select Any One Toolhead1 Configuration
# Disabled for single toolhead
[include TOOLHEADS_TD-01_TOOLHEAD1.cfg]
#[include TOOLHEADS_TD-02_TOOLHEAD1.cfg]
########################################


[printer]
kinematics: hybrid_corexy
max_velocity: 400 #1000 #700
max_accel: 8000 #30000
max_accel_to_decel: 7000 # 5000
max_z_velocity: 20
max_z_accel: 50 #50

########################################
# IDEX Config
########################################

[gcode_macro PRINTER_VARIABLES]
# Offset coordinates for dual_carriage
variable_offset_x: 0 #-0.06  #-0.3 #was -0.15
variable_offset_y: 0 #-0.15 #was -0.15 #-0.3 #was0
variable_offset_z: 0  # 0.23
# Autopark parameters
## default autopark: 0:inactive - 1:active
variable_autopark: 1
variable_z_hop: 0.6
variable_movespeed: 400 #mm/s
variable_feedrate: 8000 #mm/min
# HeatBed size
variable_bed_x_min: 0
variable_bed_x_max: 600
variable_bed_y_min: 0
variable_bed_y_max: 300
variable_bed_z_min: 0
variable_bed_z_max: 422
# Print cooling fans names
variable_fan0: 'extruder_CF'
variable_fan1: 'extruder1_CF'
# Extruders temp
variable_offset_temp: 4
# Pause Positions
variable_tool0_pause_position_x: -30 # was -60
variable_tool0_pause_position_y: -80
variable_tool1_pause_position_x: 660 # was 685
variable_tool1_pause_position_y: -80
# Printer Configuration
variable_is_dual_nozzle: 1
variable_ptfe_tube_length: 1500
# Bed Calibration Positions
variable_bed_calibration_x1: 92
variable_bed_calibration_y1: 27
variable_bed_calibration_x2: 507
variable_bed_calibration_y2: 27
variable_bed_calibration_x3: 302
variable_bed_calibration_y3: 273
variable_bed_calibration_x4: 302
variable_bed_calibration_y4: 150
gcode:
    G90

########################################
# X Axis
########################################

[stepper_x]
position_endstop: -70.000
position_min: -70.000
position_max: 620.000

########################################
# IDEX Axis
########################################

[dual_carriage]
position_endstop: 695 
position_min: -2
position_max: 695

########################################
# Y Axis
########################################

[stepper_y]
position_endstop: 350
position_max: 350
position_min: -80
dir_pin: !PB3

[stepper_y1]
dir_pin: PG12

########################################
# Z Axis
########################################

[stepper_z]
position_endstop: 418 #422 #410 #417.000
position_max: 418 #422 #410 #417.000
position_min: -10
rotation_distance: 6.35


########################################
# Redundant Extruder Extruder Side 0
########################################

[extruder_stepper extruder_side0]
dir_pin: PD7

########################################
# Redundant Extruder Extruder Side 1
########################################

[extruder_stepper extruder_side1]
dir_pin: PD3


########################################
# Bed Mesh
########################################

[bed_mesh]
mesh_min: 50, 10
mesh_max: 570, 290
probe_count: 5,3
speed: 200

########################################
# Input Shaping and Resonance
########################################

[resonance_tester]
probe_points:
    300,150,30
accel_chip: adxl345 toolhead0